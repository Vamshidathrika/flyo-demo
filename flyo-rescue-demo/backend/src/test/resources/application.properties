spring.application.name=flyo-rescue-backend-test

spring.datasource.url=jdbc:h2:mem:flyodb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Disable real network calls in test mode
whatsapp.meta.enabled=true
whatsapp.meta.phone-number-id=mock_phone_number_id
whatsapp.meta.access-token=mock_access_token
whatsapp.meta.verify-token=flyo_whatsapp_verify_token_2026
whatsapp.meta.app-secret=flyo_meta_app_secret_test_key_2026
whatsapp.meta.operator-phone=919876543210

airline.booking.provider=SANDBOX
payment.vcc.provider=SANDBOX
