server.port=8080

spring.application.name=flyo-rescue-backend

# In-Memory H2 Database with Flyway Schema Migrations
spring.datasource.url=jdbc:h2:mem:flyodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Actuator Endpoints for Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger Specification
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Meta WhatsApp Cloud API Configuration
whatsapp.meta.enabled=true
whatsapp.meta.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:mock_phone_number_id}
whatsapp.meta.access-token=${WHATSAPP_ACCESS_TOKEN:mock_access_token}
whatsapp.meta.verify-token=${WHATSAPP_VERIFY_TOKEN:flyo_whatsapp_verify_token_2026}
whatsapp.meta.app-secret=${WHATSAPP_APP_SECRET:flyo_meta_app_secret_test_key_2026}
whatsapp.meta.operator-phone=${WHATSAPP_OPERATOR_PHONE:919876543210}

# External Flight Booking Channel Selection (GDS/NDC/SANDBOX)
airline.booking.provider=SANDBOX

# Corporate Payment Provider (STRIPE/LITHIC/SANDBOX)
payment.vcc.provider=SANDBOX

# Synthetic Demo & Test Fixture Seeding (Strictly disabled by default, enabled only via explicit dev/demo/test profiles)
flyo.seeding.enabled=false

# Passenger Confirmation OTP Security Configuration
flyo.otp.expiry-minutes=10
flyo.otp.max-failed-attempts=5
flyo.otp.lockout-minutes=30

# Flyo Predictive Intelligence FastAPI Service Configuration
flyo.ml.prediction.enabled=true
flyo.ml.prediction.base-url=${FLYO_ML_SERVICE_URL:http://localhost:8000}
flyo.ml.prediction.timeout-ms=1500
flyo.ml.monitoring.api-key=${FLYO_MONITORING_API_KEY:flyo-monitoring-secret-key-2026}
