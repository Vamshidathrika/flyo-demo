# Flyo Disruption Recovery Platform — Production Configuration Profile
server.port=${PORT:8080}
spring.application.name=flyo-rescue-backend

# Production Relational Database: PostgreSQL 14+
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flyo_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:flyo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:flyo_secure_password_2026}

# HikariCP Enterprise Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=FlyoHikariPoolProd

# Flyway Versioned Migrations: Sole Source of Truth
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Hibernate in Production: Validate against Flyway Schema, Never Mutate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Meta WhatsApp Cloud API Production Credentials
whatsapp.meta.enabled=${WHATSAPP_ENABLED:false}
whatsapp.meta.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.meta.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.meta.verify-token=${WHATSAPP_VERIFY_TOKEN:}
whatsapp.meta.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.meta.operator-phone=${WHATSAPP_OPERATOR_PHONE:919876543210}

# External Flight Booking Channels (GDS / NDC)
airline.booking.provider=${AIRLINE_BOOKING_PROVIDER:SANDBOX}
airline.booking.amadeus.client-id=${AMADEUS_CLIENT_ID:}
airline.booking.amadeus.client-secret=${AMADEUS_CLIENT_SECRET:}

# Corporate Treasury VCC Provider
payment.vcc.provider=${VCC_PROVIDER:SANDBOX}
payment.vcc.api-key=${VCC_API_KEY:}
payment.vcc.webhook-secret=${VCC_WEBHOOK_SECRET:}
