name: Flyo Production CI Pipeline

on:
  push:
    branches: [ main, develop, "release/*", "feature/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-verification:
    name: Backend Test & Flyway Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flyodb
          POSTGRES_USER: flyo_admin
          POSTGRES_PASSWORD: flyo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python 3.11 for Live ML Integration
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML Microservice Dependencies & Start Daemon
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
          nohup python -m uvicorn ml.service.main:app --host 0.0.0.0 --port 8000 > /tmp/ml-service.log 2>&1 &
          for i in {1..20}; do
            if curl -s http://localhost:8000/health/live | grep -q "status"; then
              echo "ML service started and verified healthy on :8000"
              break
            fi
            echo "Waiting for ML service on :8000..."
            sleep 1
          done

      - name: Compile and Run All Unit & Integration Tests
        run: |
          cd flyo-rescue-demo/backend
          mvn clean test -B
        env:
          SPRING_PROFILES_ACTIVE: default
          POSTGRES_URL: jdbc:postgresql://localhost:5432/flyodb
          POSTGRES_USER: flyo_admin
          POSTGRES_PASSWORD: flyo_test_password
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/flyodb
          SPRING_DATASOURCE_USERNAME: flyo_admin
          SPRING_DATASOURCE_PASSWORD: flyo_test_password

  frontend-verification:
    name: Frontend Lint & Production Asset Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: flyo-rescue-demo/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd flyo-rescue-demo/frontend
          npm ci || npm install

      - name: Run Frontend Tests
        run: |
          cd flyo-rescue-demo/frontend
          npm test

      - name: Build Production Distribution
        run: |
          cd flyo-rescue-demo/frontend
          npm run build

  ml-verification:
    name: Machine Learning Disruption Predictor Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run ML Unit Tests
        run: |
          python -m unittest discover -s ml/tests
