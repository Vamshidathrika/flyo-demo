name: Flyo Production CI Pipeline

on:
  push:
    branches: [ main, develop, "release/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-verification:
    name: Backend Test & Flyway Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flyodb
          POSTGRES_USER: flyo_admin
          POSTGRES_PASSWORD: flyo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run All Unit & Integration Tests
        run: |
          cd flyo-rescue-demo/backend
          mvn clean test -B
        env:
          SPRING_PROFILES_ACTIVE: default
          POSTGRES_URL: jdbc:postgresql://localhost:5432/flyodb
          POSTGRES_USER: flyo_admin
          POSTGRES_PASSWORD: flyo_test_password

  frontend-verification:
    name: Frontend Lint & Production Asset Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: flyo-rescue-demo/frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd flyo-rescue-demo/frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd flyo-rescue-demo/frontend
          npm test

      - name: Build Production Distribution
        run: |
          cd flyo-rescue-demo/frontend
          npm run build

  ml-verification:
    name: Machine Learning Disruption Predictor Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ml/requirements.txt ]; then pip install -r ml/requirements.txt; else pip install scikit-learn numpy pydantic; fi

      - name: Run ML Unit Tests
        run: |
          python -m unittest discover -s ml/tests
